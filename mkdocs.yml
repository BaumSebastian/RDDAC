# TODO: Update site_url when Read the Docs is set up
site_name: RDDAC Documentation
site_url: https://rddac.readthedocs.io
site_description: Real Deep Drawing and Cutting Dataset - Python interface
site_author: Sebastian Baum

repo_name: BaumSebastian/RDDAC
repo_url: https://github.com/BaumSebastian/RDDAC

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - toc.follow
    - content.code.copy

watch:
  - rddac
  - docs/macros.py

plugins:
  - search
  - macros:
      module_name: docs/macros
  - mkdocstrings:
      handlers:
        python:
          options:
            preload_modules: [ddacs]
            docstring_style: google
            # rddac docstrings group related args ("vmin / vmax"); keep griffe
            # from failing the strict build over those combined entries.
            docstring_options:
              warnings: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Dataset:
      - Overview: dataset.md
      - Process Parameters: process-parameters.md
      - HDF5 Structure: hdf5-structure.md
      - Croissant Manifest: croissant.md
  - Tutorials:
      - Overview: tutorials/index.md
      - 1. Getting Started: tutorials/getting-started.md
      - 2. Build your own view: tutorials/views.md
      - 3. PyTorch training: tutorials/pytorch.md
      - 4. Visualization: tutorials/visualization.md
      - 5. Loose HDF5 recipe: tutorials/loose-h5.md
      - 6. Streaming and numpy export: tutorials/streaming.md
  - CLI Reference: cli.md
  - API Reference:
      - Overview: api/index.md
      - Croissant: api/croissant.md
      - HDF5: api/h5.md
      - Streaming: api/streaming.md
      - PyTorch: api/pytorch.md
      - Visualization: api/visualization.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BaumSebastian/RDDAC
